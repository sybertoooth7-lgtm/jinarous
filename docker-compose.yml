version: "3.8"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/data/alux.db        # switch to PostgreSQL later; for now, persistent volume
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - CLUSTER_MODE=true
      - CONTACT_RATE_LIMIT_WINDOW_MINUTES=15
      - CONTACT_RATE_LIMIT_MAX=5
      - SENTRY_DSN=${SENTRY_DSN}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    volumes:
      - app-data:/data
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      replicas: 2                    # horizontal scale; needs PostgreSQL to work safely

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Uncomment when you're ready to migrate from SQLite:
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: alux
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: alux_plaza
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  app-data:
  redis-data:
  # postgres-data:
