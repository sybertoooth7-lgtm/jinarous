server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip common text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SPA fallback: react-router handles client-side routes, so any path
    # that doesn't match a real static file falls back to index.html
    # rather than nginx returning its own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets Vite produces (JS/CSS with content
    # hashes in the filename); index.html itself is NOT cached long, so a
    # new deploy is picked up immediately rather than served stale.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
