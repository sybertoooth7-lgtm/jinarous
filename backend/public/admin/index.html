<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alux Plaza — Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login-view" class="view">
    <form id="login-form" class="login-card">
      <h1>Alux Plaza Admin</h1>
      <p class="subtitle">Sign in to view contact submissions</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign In</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-view" class="view" hidden>
    <header class="topbar">
      <h1>Alux Plaza — Submissions</h1>
      <div class="topbar-right">
        <span id="admin-email"></span>
        <button id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <input id="search-input" type="search" placeholder="Search name, email, company…" />
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="read">Read</option>
        <option value="archived">Archived</option>
      </select>
      <button id="refresh-btn" class="btn-secondary">Refresh</button>
    </section>

    <section>
      <table id="submissions-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Company</th>
            <th>Message</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="submissions-body">
          <tr><td colspan="7" class="empty">Loading…</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <button id="prev-page" class="btn-secondary">Prev</button>
        <span id="page-info"></span>
        <button id="next-page" class="btn-secondary">Next</button>
      </div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
