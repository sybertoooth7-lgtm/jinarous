<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f; color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0;
    }
    form {
      background: #111118; padding: 2.5rem; border-radius: 12px;
      width: 100%; max-width: 360px; border: 1px solid #1f1f2e;
    }
    h2 { margin: 0 0 1.5rem; font-size: 1.5rem; }
    input {
      width: 100%; padding: 0.75rem 1rem; margin-bottom: 1rem;
      background: #0a0a0f; border: 1px solid #2a2a3c; color: #e2e8f0;
      border-radius: 6px; font-size: 1rem;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      width: 100%; padding: 0.75rem; background: #3b82f6; color: #fff;
      border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .error { color: #ef4444; margin-top: 0.75rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" required autocomplete="email">
    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Log In</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) throw new Error('Invalid credentials');
        window.location.href = '/admin/index.html';
      } catch (err) {
        document.getElementById('error').textContent = err.message;
      }
    });
  </script>
</body>
</html>
