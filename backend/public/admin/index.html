<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
<base target="_blank">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="login-box">
        <h1>Admin Login</h1>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required placeholder="admin@example.com">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-primary">Sign In</button>
          <p id="login-error" class="error-text"></p>
        </form>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen hidden">
      <header class="topbar">
        <h2>Contact Submissions</h2>
        <div class="topbar-actions">
          <span id="user-email"></span>
          <button id="logout-btn" class="btn-secondary">Logout</button>
        </div>
      </header>

      <main class="dashboard-main">
        <!-- Filters -->
        <div class="filters">
          <input type="text" id="search-input" placeholder="Search name, email, company, message...">
          <select id="status-filter">
            <option value="">All Statuses</option>
            <option value="new">New</option>
            <option value="read">Read</option>
            <option value="replied">Replied</option>
            <option value="archived">Archived</option>
          </select>
          <button id="apply-filters" class="btn-primary">Filter</button>
          <button id="clear-filters" class="btn-secondary">Clear</button>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
          <div class="stat">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-showing">0</span>
            <span class="stat-label">Showing</span>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table id="submissions-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Company</th>
                <th>Message</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="submissions-body">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
          <button id="prev-page" class="btn-secondary">← Prev</button>
          <span id="page-info">Page 1 of 1</span>
          <button id="next-page" class="btn-secondary">Next →</button>
        </div>
      </main>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
